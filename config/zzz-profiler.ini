[Capture]
; 0 disabled, 1 counts, 2 sampled CPU/GPU timing, 3 short targeted timing
Level=2
Seconds=45
; Levels 2 and 3 sample GPU frames at the specified interval
GpuEveryNFrames=4
; CPU draw/bind timing samples 1 in this many calls at level 2
CpuSampleEvery=16
StallMicroseconds=1000
; Level 3 optionally focuses GPU segment queries on this XXMI shader hash (hex)
ShaderHash=0
